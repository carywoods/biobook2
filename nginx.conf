server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets cache
    location ~* \.(css|js|woff2?|ttf|png|jpg|jpeg|gif|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Pretty URLs: /foo/ -> /foo/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Cache busting for hashed assets if used
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
