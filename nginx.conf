server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pretty URLs: /docs/foo/ -> /docs/foo/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Long cache for fingerprinted theme assets (Hugo adds content hashes)
    location ~* \.(css|js|mjs|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Do not cache HTML so content updates appear immediately
    location ~* \.html?$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;
}
